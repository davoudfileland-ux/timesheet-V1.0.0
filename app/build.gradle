plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.fileland.timesheet'
    compileSdk 34

    defaultConfig {
        applicationId "ir.fileland.timesheet"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    // کلید امضای ثابت: هر بیلد جدید روی نسخه‌ی قبلی نصب می‌شود و اطلاعات پاک نمی‌شود
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
