<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b6ca8">
<title>تایم‌شیت من</title>

</head>
<body>
<div id="app">

  <nav class="bn">

  </nav>
  <button class="fab" id="fab" data-act="add" aria-label="ثبت کار">＋</button>

  <div class="toast" id="toast"></div>
</div>
